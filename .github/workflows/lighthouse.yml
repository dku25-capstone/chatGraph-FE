name: Run Lighthouse CI
on: [push, pull_request]

jobs:
  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install packages
        run: |
          npm ci
          npm install -g @lhci/cli
        working-directory: ./front

      - name: Build
        run: npm run build
        working-directory: ./front

      - name: Run Lighthouse CI
        run: lhci autorun
        working-directory: ./front
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Report to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: docs

      - name: Post Performance Report
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const docsPath = path.join(process.cwd(), 'docs');

            if (!fs.existsSync(docsPath)) {
              console.log('Docs directory not found.');
              return;
            }

            const files = fs.readdirSync(docsPath).filter(file => file.endsWith('.json'));
            if (files.length === 0) return;

            // Simple average or just take first run
            const file = files[0];
            const report = JSON.parse(fs.readFileSync(path.join(docsPath, file), 'utf8'));
            const categories = report.categories;

            const formatScore = (score) => {
              const val = Math.round(score * 100);
              const icon = val >= 90 ? '🟢' : (val >= 50 ? '🟠' : '🔴');
              return `${icon} ${val}`;
            };

            let body = `### ⚡️ Lighthouse Performance Report \n\n`;
            body += `| Category | Score |\n| --- | --- |\n`;
            
            Object.values(categories).forEach(cat => {
              body += `| ${cat.title} | ${formatScore(cat.score)} |\n`;
            });

            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else if (context.eventName === 'push') {
              await github.rest.repos.createCommitComment({
                commit_sha: context.sha,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }